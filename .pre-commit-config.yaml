repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gitleaks-system
        name: Gitleaks system binary (history scan)
        entry: gitleaks git --redact --verbose
        language: system
        pass_filenames: false
        stages: [manual]
